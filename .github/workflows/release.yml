name: Multi-Platform Release

on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset_name: top++-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: top++-macos-universal.tar.gz
          - os: windows-latest
            asset_name: top++-windows-x86_64.tar.gz
        build_type: [Release]

    steps:
      - uses: actions/checkout@v7

      - name: Config and Build (Linux)
        run: |
          docker run --rm --entrypoint /bin/bash \
          -v "${{ github.workspace }}:/workspace" \
          asobhani/ubuntu18-gcc15 -c \
          'cmake -B /workspace/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DTOPPP_ENABLE_STATIC=ON \
          -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-s" \
          && cmake --build /workspace/build --config Release \
          && cpack --config /workspace/build/CPackConfig.cmake -C Release -G TGZ'
        if: matrix.os == 'ubuntu-latest'

      - name: Config and Build (macOS/Windows)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTOPPP_ENABLE_STATIC=ON -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-s"
          cmake --build build --config ${{ matrix.build_type }}
          cpack --config build/CPackConfig.cmake -C Release -G TGZ
        if: matrix.os != 'ubuntu-latest'

      - name: Stash build artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.asset_name }}
          archive: false
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: Aggregate Checksums and Attach Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Verify downloaded artifacts
        run: |
          if [ ! -d dist ] || [ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > top++-SHA-256.txt
          echo "Generated checksums:"
          cat top++-SHA-256.txt

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
