name: Multi-Platform Release

on:
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
      - uses: actions/checkout@v7

      - name: Config and Build (Linux)
        uses: docker://asobhani/ubuntu18-gcc15
        with:
          entrypoint: /bin/bash
          args: -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release -DTOPPP_ENABLE_STATIC=ON && cmake --build build --parallel'
        if: matrix.os == 'ubuntu-latest'

      - name: Config and Build (Windows)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTOPPP_ENABLE_STATIC=ON
          cmake --build build --config ${{ matrix.build_type }} --parallel
          cpack --config build/CPackConfig.cmake -C Release -G WIX
        if: matrix.os == 'windows-latest'

      - name: Config and Build (macOS)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTOPPP_ENABLE_STATIC=ON
          cmake --build build --config ${{ matrix.build_type }} --parallel
          cpack --config build/CPackConfig.cmake -C Release -G DragNDrop
        if: matrix.os == 'macos-latest'

      - name: Stash build artifact (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: top++-${{ github.ref_name }}-linux-x86_64
          path: build/top++
          if-no-files-found: warn
        if: matrix.os == 'ubuntu-latest'

      - name: Stash build artifact (macOS)
        uses: actions/upload-artifact@v7
        with:
          path: top++-${{ github.ref_name }}-macos-universal.dmg
          archive: false
          if-no-files-found: warn
        if: matrix.os == 'macos-latest'

      - name: Stash build artifact (Windows)
        uses: actions/upload-artifact@v7
        with:
          path: top++-${{ github.ref_name }}-win64.msi
          archive: false
          if-no-files-found: warn
        if: matrix.os == 'windows-latest'

  publish:
    name: Aggregate Checksums and Attach Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          find . -type f -not -name "checksums.txt" | sort | xargs sha256sum > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
