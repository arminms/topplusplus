name: Build and Test (Linux/macOS/Windows)

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:

env:
  # Tell vcpkg to store/read prebuilt binary archives in a dedicated local folder
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            build_type: Release
          - os: windows-latest
            triplet: x64-windows
            build_type: Release
          - os: macos-latest
            triplet: arm64-osx
            build_type: Release
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Ensure binary cache directory exists
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-bincache"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      - name: Configure, build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with C++ tools was not found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cmake --preset vcpkg -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DTOPPP_ENABLE_TESTS=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build --config ${{ matrix.build_type }} --parallel
          if errorlevel 1 exit /b 1
          set CTEST_PARALLEL_LEVEL=1
          ctest --test-dir build --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Configure CMake
        if: runner.os != 'Windows'
        run: >
          cmake --preset vcpkg
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DTOPPP_ENABLE_TESTS=ON

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        if: runner.os != 'Windows'
        working-directory: ${{github.workspace}}/build
        env:
          CTEST_PARALLEL_LEVEL: 1
        run: ctest --output-on-failure
