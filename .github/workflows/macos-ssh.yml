name: macOS SSH smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTOPPP_ENABLE_STATIC=ON -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-s"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Open SSH session
        uses: owenthereal/action-upterm@111c75f07dee6470e7ff7eb108db0d317ac9a3f8 # v2
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 10
